# Rockchip RK3368 Geekbox
BOARD_NAME="Geekbox"
BOARDFAMILY="rockchip64"
BOOTCONFIG="geekbox_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current,edge"

BOOT_SOC="rk3368"
BOOT_FDTFILE="rk3368-geekbox.dtb"
FDTFILE="rockchip/rk3368-geekbox.dtb"
BOOT_SCENARIO="only-blobs"

# To fix the U-Boot compile errors and missing bl31.elf for rk3368, we
# use only-blobs scenario which injects the working bl31 and miniloader
# directly from the rockchip blob repository, bypassing the broken u-boot.its
# ATF packaging logic.
DDR_BLOB="rk33/rk3368_ddr_600MHz_v2.03.bin"
MINILOADER_BLOB="rk33/rk3368_miniloader_v2.63.bin"
BL31_BLOB="rk33/rk3368_bl31_v1.91.bin"

# ATF is pre-compiled and injected via BL31_BLOB above.
ATF_COMPILE="no"
