name: Build Armbian for Geekbox

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Armbian Build Framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: armbian-build
          ref: main

      - name: Copy Board Config
        run: cp config/boards/geekbox.conf armbian-build/config/boards/

      - name: Copy User Patches
        run: |
          mkdir -p armbian-build/userpatches
          cp -r userpatches/* armbian-build/userpatches/ || true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,riscv64,arm,loongarch64

      - name: Build Image
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD=geekbox \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=no \
            KERNEL_CONFIGURE=no \
            NO_APT_CACHER=yes \
            EXPERT=yes

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-image
          path: armbian-build/output/images/*
